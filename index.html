<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Levantamento Moletom - Terceirão</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { padding-bottom: 96px; }
  </style>
</head>
<body class="bg-zinc-100 text-zinc-900 font-sans antialiased">

  <header class="bg-zinc-900 text-white py-5 px-4 shadow-md">
    <div class="max-w-lg mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold tracking-tight">Moletom • Terceirão</h1>
        <p class="text-zinc-400 text-sm mt-0.5">Escolha seu modelo e adicionais para o orçamento da turma</p>
      </div>
      <a href="admin.html" class="text-xs text-zinc-400 hover:text-white border border-zinc-700 px-2.5 py-1.5 rounded-lg transition">
        Painel
      </a>
    </div>
  </header>

  <main class="max-w-lg mx-auto p-4 space-y-5">

    <!-- 1. Nome e Número no Moletom -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-zinc-200 space-y-3">
      <h2 class="font-semibold text-base text-zinc-800">1. Nome e Número</h2>
      <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
        <div class="sm:col-span-8">
          <label class="block text-xs font-medium text-zinc-600 mb-1">Nome Completo *</label>
          <input type="text" id="nomeAluno" placeholder="Ex: Theolino Foster"
            class="w-full px-3 py-2.5 rounded-lg border border-zinc-300 focus:outline-none focus:ring-2 focus:ring-zinc-900 text-sm" />
        </div>
        <div class="sm:col-span-4">
          <label class="block text-xs font-medium text-zinc-600 mb-1">Número no Moletom *</label>
          <input type="text" id="numeroMoletom" inputmode="numeric" maxlength="3" placeholder="Ex: 10"
            class="w-full px-3 py-2.5 rounded-lg border border-zinc-300 focus:outline-none focus:ring-2 focus:ring-zinc-900 text-sm" />
        </div>
      </div>
    </section>

    <!-- 2. Escolha do Modelo -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-zinc-200 space-y-3">
      <h2 class="font-semibold text-base text-zinc-800">2. Escolha o Modelo</h2>
      
      <div class="rounded-lg overflow-hidden border border-zinc-200 bg-white">
        <img id="imgComparativo" 
             src="comparativo.jpg" 
             alt="Diferença entre Moletom Classic e Balloon" 
             class="w-full h-52 object-contain bg-white" />
        <p class="text-[11px] text-zinc-500 px-3 py-1.5 bg-zinc-100 border-t border-zinc-200">
          <strong>Classic:</strong> modelagem tradicional com opção de cordinha. &nbsp;|&nbsp; <strong>Balloon:</strong> caimento mais largo/boxy (não possui cordinha).
        </p>
      </div>

      <div class="grid grid-cols-1 gap-2.5 pt-1">
        <label class="flex items-center justify-between p-3.5 rounded-xl border-2 border-zinc-900 bg-zinc-50 cursor-pointer transition" id="cardClassic">
          <div class="flex items-center gap-3">
            <input type="radio" name="modelo" value="Classic" checked class="w-4 h-4 accent-zinc-900" />
            <div>
              <p class="font-semibold text-sm">Moletom Classic</p>
              <p class="text-xs text-zinc-500">Tamanhos PP ao XXG • Aceita cordinha</p>
            </div>
          </div>
          <span class="font-bold text-sm text-zinc-900">R$ 225,00</span>
        </label>

        <label class="flex items-center justify-between p-3.5 rounded-xl border border-zinc-300 bg-white cursor-pointer transition" id="cardBaloon">
          <div class="flex items-center gap-3">
            <input type="radio" name="modelo" value="Balloon" class="w-4 h-4 accent-zinc-900" />
            <div>
              <p class="font-semibold text-sm">Moletom Balloon</p>
              <p class="text-xs text-zinc-500">Tamanhos PP ao XG • Sem cordinha</p>
            </div>
          </div>
          <span class="font-bold text-sm text-zinc-900">R$ 265,00</span>
        </label>
      </div>
    </section>

    <!-- 3. Tamanho e Medidas -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-zinc-200 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold text-base text-zinc-800">3. Tamanho e Medidas</h2>
        <button type="button" id="btnToggleTabela" class="text-xs font-semibold text-emerald-700 hover:underline">
          Ver tabela completa
        </button>
      </div>

      <div class="grid grid-cols-6 gap-2" id="tamanhosContainer">
        <button type="button" data-size="PP" class="size-btn py-2 rounded-lg border border-zinc-300 text-sm font-medium hover:bg-zinc-100">PP</button>
        <button type="button" data-size="P" class="size-btn py-2 rounded-lg border border-zinc-300 text-sm font-medium hover:bg-zinc-100">P</button>
        <button type="button" data-size="M" class="size-btn py-2 rounded-lg border-zinc-900 bg-zinc-900 text-white text-sm font-medium">M</button>
        <button type="button" data-size="G" class="size-btn py-2 rounded-lg border border-zinc-300 text-sm font-medium hover:
